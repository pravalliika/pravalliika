name: Update GitHub analytics cards

on:
  schedule:
    - cron: "0 3 * * *"      # daily
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards
        env:
          # Add a classic PAT (read:user) as repo secret STATS_TOKEN to include private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_cards.py pravalliika
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh analytics cards"
          git push
